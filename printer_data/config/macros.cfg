# This file provides examples of Klipper G-Code macros.  The snippets
# in this file may be copied into the main printer.cfg file and
# customized.

# See docs/Config_Reference.md for a description of parameters.


######################################################################
# Start Print and End Print
######################################################################

# Replace the slicer's custom start and end g-code scripts with
# START_PRINT and END_PRINT. See docs/Slicers.md for more information on using these macros.
   
    
[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    {% set MATERIAL = params.MATERIAL|default("PLA")|string %}
    
    # Set chamber exhaust temp based on material
    {% if MATERIAL == "ABS" or MATERIAL == "ASA" %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=Chamber_Exhaust target=65
        {% set zoffset = 0.15 %}
    {% elif MATERIAL == "PETG" %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=Chamber_Exhaust target=50
        {% set zoffset = 0.0 %}
    {% else %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=Chamber_Exhaust target=35
        {% set zoffset = 0.0 %}
    {% endif %}

    SET_GCODE_OFFSET Z=0
    # Heat nozzle for probing
    STATUS_HEATING
    M140 S{BED_TEMP}
    M109 S190
    # Heat bed for probing
    M190 S{BED_TEMP}
    # Use absolute coordinates
    G90
    STATUS_HOMING
    # Home the printer
    G28
    #clean Nozzle and rehome
    clean_nozzle
    G32
    # If you are generating a new bed mesh:
    STATUS_MESHING
    BED_MESH_CALIBRATE ADAPTIVE=1
    #BED_MESH_PROFILE LOAD=default
    STATUS_HEATING
    M104 S{EXTRUDER_TEMP}
    # Move the nozzle near the bed
    G1 Z5 F3000
    # Set and wait for nozzle to reach printing temperature
    M109 S{EXTRUDER_TEMP}
    SET_GCODE_OFFSET Z={zoffset}
    # Start printing!
    STATUS_PRINTING

# Enable exclude_object for adaptive meshing
[exclude_object]

[gcode_macro PRINT_START]
gcode:
    START_PRINT {rawparams}

[gcode_macro PRINT_END]
gcode:
    END_PRINT {rawparams}


[gcode_macro END_PRINT]
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament
    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X325 Y325 F3600            ; park nozzle at rear
    BED_MESH_CLEAR

[gcode_macro NOZZLE_CHANGE]
gcode:
    G90            ;absolute mode
    M109 S220      ;heat the nozzle
    G32            ;home the printer
    G1 Z200 F3000  ;raise the gantry
    G1 E-10        ;retract the filament

[gcode_macro LOAD_FILAMENT]
variable_load_distance:  50
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    G1 E{load_distance} F{max_velocity} # fast-load
    G1 E{purge_distance} F{speed} # purge
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance:  50
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    G1 E{purge_distance} F{speed} # purge
    G1 E-{unload_distance} F{max_velocity} # fast-unload
    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro G32]
gcode:
    STATUS_HOMING
    BED_MESH_CLEAR
    G0 X325 Y325 Z5 F4000
    G28
    STATUS_MESHING
    QUAD_GANTRY_LEVEL
    STATUS_HOMING
    G0 X325 Y325 Z5 F4000
    G28
    STATUS_READY
    #--------------------------------------------------------------------
   
[gcode_macro M141]
gcode:
    {% set s = params.S|default(0)|float %}
    SET_TEMPERATURE_FAN_TARGET temperature_fan="Chamber" target={s}


######################################################################
# Filament Change
######################################################################

# M600: Filament Change. This macro will pause the printer, move the
# tool to the change position, and retract the filament 50mm. Adjust
# the retraction settings for your own extruder. After filament has
# been changed, the print can be resumed from its previous position
# with the "RESUME" gcode.

[pause_resume]

[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

