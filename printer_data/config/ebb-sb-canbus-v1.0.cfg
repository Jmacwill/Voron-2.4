# This file contains common pin mappings for the BIGTREETECH EBBCan
# Canbus board. To use this config, the firmware should be compiled for the
# RP2040 with "USB" or "CAN bus (on gpio4/gpio5)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBCan]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid: 5a218a9634d6

[temperature_sensor Tool_Head_Temp]
sensor_type: Generic 3950
sensor_pin: EBBCan:gpio28

[adxl345]
cs_pin: EBBCan:gpio1
spi_software_sclk_pin: EBBCan:gpio2
spi_software_mosi_pin: EBBCan:gpio0
spi_software_miso_pin: EBBCan:gpio3
axes_map: z,-y,x

[resonance_tester]
probe_points: 100, 100, 20
accel_chip: adxl345

[extruder]
step_pin: EBBCan:gpio18
dir_pin: EBBCan:gpio19
enable_pin: !EBBCan:gpio17
microsteps: 16
rotation_distance: 22.6789511
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:gpio7
sensor_type: PT1000
sensor_pin: EBBCan:gpio27
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
#min_temp: 0
#max_temp: 500

[tmc2209 extruder]
uart_pin: EBBCan:gpio20
run_current: 0.650
stealthchop_threshold: 999999

[fan]
pin: EBBCan:gpio13

[heater_fan hotend_fan]
pin: EBBCan:gpio14
heater: extruder
heater_temp: 50.0

[temperature_fan Tool_Head_Fan]
pin: EBBCan:gpio6
sensor_type: temperature_combined
sensor_list: temperature_sensor Tool_Head_Temp
combination_method: max
target_temp: 45.0
min_temp: 0
max_temp: 100
max_speed: 1.0
min_speed: 0.3
maximum_deviation: 999.0
control: watermark
#tachometer_pin: EBBCan:gpio12

[probe]
pin: ^EBBCan:gpio22

samples: 3                    # Take 3 samples per point
samples_result: median        # Use median of the 3 samples
samples_tolerance: 0.01       # Max difference allowed between samples (mm)
samples_tolerance_retries: 3  # Retry up to 3 times if tolerance exceeded

